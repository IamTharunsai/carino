# Continuous backend deploy: every push to main that touches backend/supabase
# applies new migrations and redeploys all Edge Functions.
# Repo secrets needed: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID
# Until they exist the job skips (green) instead of failing.
name: supabase-deploy
on:
  push:
    branches: [main]
    paths: ["backend/supabase/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - if: env.SUPABASE_PROJECT_ID == ''
        run: echo "::notice::Supabase secrets not set; skipping deploy."
      - if: env.SUPABASE_PROJECT_ID != ''
        uses: actions/checkout@v4
      - if: env.SUPABASE_PROJECT_ID != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: env.SUPABASE_PROJECT_ID != ''
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - if: env.SUPABASE_PROJECT_ID != ''
        run: supabase db push
      - if: env.SUPABASE_PROJECT_ID != ''
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
