# Gate every push/PR: analyze + test + Android build. iOS builds on a macOS runner.
name: flutter-ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same JDK as the dev machines; the runner default crashes AGP lint
      # (lintVitalAnalyzeRelease NoSuchMethodError in url_launcher_android).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos > analyze.log 2>&1 || (grep -v '^ *info' analyze.log | tail -9 | sed 's/^/::error::/'; exit 1)
      - run: flutter test --reporter github   # failures show as annotations on the run
      - run: flutter build apk --release --dart-define=USE_MOCK_BACKEND=true
      - uses: actions/upload-artifact@v4
        with:
          name: carino-android-demo
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # ponytail: unsigned build proves it compiles; signing + TestFlight upload
      # needs Apple certs as secrets — add fastlane/match once the dev account is live.
      # Demo build (sample data) so it runs without live keys.
      - run: flutter build ios --release --no-codesign --dart-define=USE_MOCK_BACKEND=true
      # Unsigned .ipa for testers: sign + install from Windows/Linux with
      # xtool (xtool.sh) using your own Apple ID. Not for the App Store.
      - run: mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/ && zip -qr carino-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: carino-ios-unsigned
          path: carino-unsigned.ipa
          retention-days: 14
