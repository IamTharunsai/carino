# Gate every push/PR: analyze + test + Android build. iOS builds on a macOS runner.
name: flutter-ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter github   # failures show as annotations on the run
      - run: flutter build apk --release

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # ponytail: unsigned build proves it compiles; signing + TestFlight upload
      # needs Apple certs as secrets — add fastlane/match once the dev account is live.
      - run: flutter build ios --release --no-codesign
